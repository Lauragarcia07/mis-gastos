<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis gastos</title>
  <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- ───────────── Configuración (primera vez o desde ⚙︎) ───────────── -->
  <section id="pantalla-config" class="contenedor config" hidden>
    <div class="config-logo">💶</div>
    <h1>Mis gastos</h1>
    <p class="texto-2">Conecta el dashboard con tu hoja. Solo hace falta una vez en cada dispositivo.</p>
    <form id="form-config" class="tarjeta">
      <label>URL de la API
        <input id="campo-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required>
      </label>
      <label>Clave secreta (token)
        <input id="campo-token" type="password" autocomplete="off" required>
      </label>
      <p id="error-config" class="error" hidden></p>
      <div class="fila-botones">
        <button type="submit" class="boton boton-principal">Guardar y entrar</button>
        <button type="button" id="boton-cancelar-config" class="boton" hidden>Cancelar</button>
      </div>
    </form>
  </section>

  <!-- ───────────── App ───────────── -->
  <div id="pantalla-app" hidden>
    <header class="cabecera">
      <div class="cabecera-fila contenedor">
        <div>
          <h1 id="titulo-pestana">Resumen</h1>
          <p id="estado" class="estado" aria-live="polite"></p>
        </div>
        <div class="cabecera-acciones">
          <span id="pastilla-viaje" class="pastilla-viaje" hidden></span>
          <button id="boton-recargar" class="boton-icono" aria-label="Recargar">↻</button>
          <button id="boton-ajustes" class="boton-icono" aria-label="Ajustes">⚙︎</button>
        </div>
      </div>
      <div id="barra-periodo" class="periodos contenedor" role="group" aria-label="Periodo">
        <button data-periodo="mes">Este mes</button>
        <button data-periodo="mesAnterior">Mes pasado</button>
        <button data-periodo="anio">Este año</button>
        <button data-periodo="todo">Todo</button>
        <button data-periodo="custom">Fechas…</button>
      </div>
      <div id="fechas-custom" class="fechas-custom contenedor" hidden>
        <label>Desde <input type="date" id="fecha-desde"></label>
        <label>Hasta <input type="date" id="fecha-hasta"></label>
      </div>
    </header>

    <main class="contenedor">
      <!-- ── Pestaña Resumen ── -->
      <section id="pestana-resumen" class="pestana">
        <div class="tarjeta heroe">
          <div class="heroe-etiqueta" id="heroe-etiqueta">Este mes</div>
          <div class="heroe-cifra" id="heroe-total">—</div>
          <div id="heroe-delta" class="heroe-delta"></div>
          <div class="heroe-stats">
            <div><span class="stat-valor" id="stat-num">—</span><span class="stat-etiqueta">gastos</span></div>
            <div><span class="stat-valor" id="stat-media">—</span><span class="stat-etiqueta">media al día</span></div>
            <div><span class="stat-valor" id="stat-extra">—</span><span class="stat-etiqueta" id="stat-extra-etiqueta">previsión</span></div>
          </div>
        </div>

        <div class="tarjeta">
          <div class="tarjeta-cabecera">
            <h2 id="titulo-donut">¿En qué se va?</h2>
            <button id="boton-volver-donut" class="enlace" hidden>‹ Todas</button>
          </div>
          <div class="donut-caja">
            <canvas id="grafico-donut" role="img" aria-label="Reparto del gasto por carpeta"></canvas>
            <div class="donut-centro">
              <div class="donut-centro-cifra" id="donut-total">—</div>
              <div class="donut-centro-etiqueta" id="donut-etiqueta">en total</div>
            </div>
          </div>
          <ul id="leyenda-donut" class="leyenda"></ul>
        </div>

        <div class="tarjeta">
          <div class="tarjeta-cabecera">
            <h2>Últimos 12 meses</h2>
          </div>
          <div class="barras-caja"><canvas id="grafico-meses" role="img" aria-label="Gasto por mes y carpeta en los últimos 12 meses"></canvas></div>
          <ul id="leyenda-meses" class="leyenda-mini"></ul>
        </div>

        <div class="tarjeta">
          <div class="tarjeta-cabecera">
            <h2>Últimos gastos</h2>
            <button class="enlace" data-ir-a="gastos">Ver todos ›</button>
          </div>
          <ul id="ultimos-gastos" class="lista-gastos"></ul>
        </div>
      </section>

      <!-- ── Pestaña Gastos ── -->
      <section id="pestana-gastos" class="pestana" hidden>
        <div class="filtros">
          <input id="buscador" type="search" placeholder="🔍  Buscar concepto o nota…">
          <div class="filtros-fila">
            <select id="filtro-carpeta" aria-label="Filtrar por carpeta">
              <option value="">Todas las carpetas</option>
            </select>
            <label class="interruptor"><input type="checkbox" id="solo-otros"> Solo «Otros»</label>
          </div>
          <div id="filtros-activos" class="filtros-activos"></div>
        </div>
        <div id="resumen-filtro" class="resumen-filtro"></div>
        <div id="lista-dias"></div>
        <button id="boton-ver-mas" class="boton boton-ancho" hidden>Ver más</button>
      </section>

      <!-- ── Pestaña Viajes ── -->
      <section id="pestana-viajes" class="pestana" hidden>
        <ul id="lista-viajes" class="viajes"></ul>
      </section>
    </main>

    <!-- Barra de pestañas -->
    <nav class="pestanas" aria-label="Secciones">
      <button data-pestana="resumen"><span class="pestana-icono">◔</span><span>Resumen</span></button>
      <button data-pestana="gastos"><span class="pestana-icono">☰</span><span>Gastos</span></button>
      <button data-pestana="viajes"><span class="pestana-icono">✈︎</span><span>Viajes</span></button>
    </nav>
  </div>

  <!-- ───────────── Hoja para editar un gasto ───────────── -->
  <div id="velo" class="velo" hidden></div>
  <section id="hoja-editar" class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
    <div class="hoja-asa"></div>
    <h2 id="hoja-titulo">Editar gasto</h2>
    <form id="form-editar">
      <label>Importe (tu parte, €)
        <input id="editar-importe" type="number" inputmode="decimal" step="0.01" min="0.01" required>
      </label>
      <label>Concepto
        <input id="editar-concepto" type="text">
      </label>
      <label>Carpeta
        <select id="editar-carpeta" required></select>
      </label>
      <label>Nota
        <input id="editar-nota" type="text">
      </label>
      <label>Fecha
        <input id="editar-fecha" type="datetime-local" required>
      </label>
      <p id="error-editar" class="error" hidden></p>
      <div class="fila-botones">
        <button type="submit" class="boton boton-principal" id="boton-guardar">Guardar</button>
        <button type="button" class="boton" id="boton-cancelar-editar">Cancelar</button>
      </div>
      <button type="button" class="boton boton-peligro boton-ancho" id="boton-borrar">Borrar gasto</button>
    </form>
  </section>

  <div id="aviso" class="aviso" role="status" hidden></div>
</body>
</html>
